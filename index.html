<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luka Dončić — De Eslovenia al mundo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600&family=Montserrat:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main>
  <canvas id="c" width="1080" height="1920" aria-label="Documental vertical sobre Luka Dončić"></canvas>
  <div class="bar">
    <button id="pp">Reproducir</button>
    <button id="rs">Reiniciar</button>
    <input id="seek" type="range" min="0" max="90" step="0.05" value="0" aria-label="Línea de tiempo">
    <span id="tm">0:00 / 1:30</span>
    <button id="ex">Exportar video</button>
  </div>
</main>
<script src="script.js"></script>
</body>
</html>
